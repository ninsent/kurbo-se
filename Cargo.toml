[package]
name = "kurbo-se"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
authors = ["Nursultan Akim <contact@nursultan.me>"]
description = "Stroke extensions for kurbo: Figma-grade stroke alignment (inside/center/outside), per-end caps, dash caps, and dashed aligned strokes"
keywords = ["stroke", "bezier", "graphics", "kurbo", "geometry"]
categories = ["graphics", "no-std"]
readme = "README.md"
repository = "https://github.com/ninsent/kurbo-se"
homepage = "https://github.com/ninsent/kurbo-se"
documentation = "https://docs.rs/kurbo-se"
exclude = ["sandbox", "examples", "docs", "upstream", ".github"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
# Get floating point functions from the standard library.
std = ["kurbo/std"]
# Use floating point implementations from libm, for no_std environments.
libm = ["kurbo/libm", "dep:libm"]
# Serialize/Deserialize for the style types.
serde = ["dep:serde", "kurbo/serde"]

[dependencies]
kurbo = { version = "0.13.1", default-features = false }
libm = { version = "0.2.15", optional = true, default-features = false }
serde = { version = "1.0", optional = true, default-features = false, features = [
    "alloc",
    "derive",
] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
infinite_loop = "warn"
semicolon_if_nothing_returned = "warn"
doc_markdown = "warn"

[dev-dependencies.criterion]
version = "0.7"
default-features = false
features = ["cargo_bench_support"]

[[bench]]
name = "expand"
harness = false
