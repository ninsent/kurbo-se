<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kurbo-se sandbox</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <aside id="panel"></aside>
    <main id="stage">
      <div id="viewport">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
          <g id="layer-shapefill"></g>
          <g id="layer-fill"></g>
          <g id="layer-ref"></g>
          <g id="layer-wire"></g>
          <g id="layer-src"></g>
          <g id="layer-dir"></g>
          <g id="layer-joins"></g>
        </svg>
        <div id="zoombar">
          <button id="zoom-out" title="Zoom out">−</button>
          <button id="zoom-pct" title="Zoom to fit">100%</button>
          <button id="zoom-in" title="Zoom in">+</button>
        </div>
      </div>
      <footer id="stats"></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
