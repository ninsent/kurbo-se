[package]
name = "kurbo-se-sandbox"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kurbo-se = { path = "../.." }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Text source: parley lays the text out, skrifa draws the glyph outlines.
# Wasm has no system fonts, so the bundled Inter is the only font and
# fontique's `system` feature stays off.
parley = { version = "0.12", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"

# The dev server builds with `wasm-pack --dev` for fast rebuilds; without
# optimization the geometry hot loops run ~20x slower and the sandbox feels
# laggy. opt-level 2 keeps rebuilds quick and interaction smooth.
[profile.dev]
opt-level = 2
